[workspace]
resolver = "2"
members = ["crates/model-ir", "crates/arch", "crates/netlist", "crates/compiler", "crates/sim", "crates/server", "crates/wasm", "crates/tokenizer-rt"]

[workspace.package]
license = "MIT"
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
