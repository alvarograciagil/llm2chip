# The online demo: the interface with its WebAssembly estimator, served by GitHub Pages.
# Every push that touches it builds it; only main publishes it.
name: Online demo

on:
  push:
    paths:
      - "web/**"
      - "crates/**"
      - "Cargo.*"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the estimator and the simulator
        run: |
          wasm-pack build crates/wasm --target web --out-dir ../../web/src/wasm --no-typescript --release
          wasm-pack build crates/wasm-sim --target web --out-dir ../../web/src/wasm-sim --no-typescript --release
      # A model small enough to load at once, served with the demo: Andrej Karpathy's
      # stories260K (llama2.c, MIT), converted at build time, so no weights live in the repository.
      - name: Convert stories260K
        env:
          SOURCE: https://huggingface.co/karpathy/tinyllamas/resolve/0bd21da7698eaf29a0d7de3992de8a46ef624add/stories260K
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o stories260K.bin "$SOURCE/stories260K.bin"
          curl -fsSL -o tok512.bin "$SOURCE/tok512.bin"
          sha256sum -c - <<'SUMS'
          b0a507e7ad0f626624f17112325e66691f9076d622e1d3274d103d00299f2696  stories260K.bin
          037cb335abb25d1fa9e8ecae30ed2a3a8ace9302862ebcdc05d51a6bbb10c312  tok512.bin
          SUMS
          python3 -I "$GITHUB_WORKSPACE/tools/convert/llama2c.py" stories260K.bin tok512.bin "$GITHUB_WORKSPACE/web/public/models/stories260K"
      - name: Build the interface
        working-directory: web
        env:
          VITE_DEMO: "1"
          LLM2CHIP_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run
          npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
