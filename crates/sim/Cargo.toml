[package]
name = "sim"
version.workspace = true
license.workspace = true
edition.workspace = true

[dependencies]
arch = { path = "../arch" }
compiler = { path = "../compiler" }
model-ir = { path = "../model-ir" }
netlist = { path = "../netlist" }
half = "2"
memmap2 = "0.9"
multiversion = "0.8"
rayon = "1"
libm = "0.2"
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
serde.workspace = true
serde_json.workspace = true
regex-syntax = "0.8"
crc32fast = "1"
tokenizer-rt = { path = "../tokenizer-rt" }
maskgit-rt = { path = "../maskgit-rt" }
unicode-normalization-alignments = "0.1"
web-time = "1"

# No Vulkan and no system probe in a browser: there the CPU path runs on WebAssembly.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ash = "0.38"
naga = { version = "30", features = ["wgsl-in", "spv-out"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-metal = "0.3"

# Voice, two parts apart: speech to text (`listen`) and text to speech (`speak`). Without
# either, nothing of voice is built.
[features]
default = ["listen", "speak"]
listen = []
speak = []

[[example]]
name = "generate"

[[example]]
name = "numeric"

[[example]]
name = "mtp"

[[example]]
name = "listen"
required-features = ["listen"]

[[example]]
name = "speak"
required-features = ["speak"]

[[example]]
name = "dac_check"
required-features = ["speak"]

[[example]]
name = "talk"
required-features = ["listen", "speak"]

[[example]]
name = "voice_system"
required-features = ["listen", "speak"]

[dev-dependencies]
chip-trace = { path = "../trace" }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
half = "2"
serde_json.workspace = true
