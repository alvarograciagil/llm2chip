[package]
name = "llm2chip-firmware"
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace]

[[bin]]
name = "firmware"
path = "src/main.rs"
test = false
bench = false

[dependencies]
tokenizer-rt = { path = "../crates/tokenizer-rt" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = false
